name: 不具合の報告 / Bug report
description: アプリが正しく動かないときに / Something in the app does not work correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Issue は誰でも見られます。** メールアドレス・パスワード・サーバーのアドレスや秘密鍵・ノートの内容は書かないでください。
        ⚠️ **Issues are public.** Do not include email addresses, passwords, server addresses, private keys or note content.

        アカウントの削除・購入・セキュリティの問題は、[サポート](https://maya27aokisawada.github.io/AmetrineVault-publish/support/)のメール窓口へ。
        For account deletion, purchases or security issues, use the email address on the [Support page](https://maya27aokisawada.github.io/AmetrineVault-publish/en/support/).
  - type: dropdown
    id: platform
    attributes:
      label: プラットフォーム / Platform
      multiple: true
      options:
        - Windows
        - macOS
        - iPad
        - Android タブレット / Android tablet
        - Chromebook
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: アプリと OS のバージョン / App and OS version
      placeholder: "例 / e.g.: AmetrineVault 1.0.0, Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 関係する機能 / Area
      multiple: true
      options:
        - ツリー・エディタ・アウトライン / Tree, editor, outline
        - 検索 / Search
        - Dropbox 連携 / Dropbox sync
        - SFTP 連携 / SFTP sync
        - アカウント・ライセンス / Account, license
        - 設定・表示 / Settings, appearance
        - その他 / Other
  - type: textarea
    id: what-happened
    attributes:
      label: 起きたこと / What happened
      description: エラーメッセージがあれば、そのまま貼ってください（個人情報は伏せて）。 / Paste any error message as is (with personal information removed).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待していた動き / Expected behavior
  - type: textarea
    id: extra
    attributes:
      label: スクリーンショット・その他 / Screenshots and other information
      description: 個人情報やノートの内容が写っていないか確認してください。 / Make sure no personal information or note content is visible.
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認 / Confirmation
      options:
        - label: 個人情報・秘密の情報を含めていません。 / I have not included personal or secret information.
          required: true
        - label: 同じ内容の Issue がないことを確認しました。 / I have checked that no existing issue covers this.
          required: true
